name: Universal Money Radar R1

on:
  pull_request:
  push:
    branches: [pivot/universal-money-radar-r1]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: universal-radar-${{ github.ref }}
  cancel-in-progress: true

env:
  RADAR_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  radar-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RADAR_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Deterministic universal radar tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_*radar.py' -v
          python -m unittest discover -s tests -p 'test_superteam_agent.py' -v
      - name: Worker syntax
        run: node --check worker/src/index.js
      - name: Zero-spend static contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/universal-radar.json').read_text())
          assert cfg['outgoing_spend_usd'] == '0'
          assert cfg['paid_model_fallback'] is False
          assert cfg['single_supervisor'] is True
          assert cfg['specialist_worker_integrations'] == 'DEFERRED'
          worker=Path('worker/src/index.js').read_text()
          assert 'ATM UNIVERSAL RADAR SNAPSHOT' in worker
          assert 'PAID' in worker and 'authoritative_paid' in worker
          print('UNIVERSAL_RADAR_ZERO_SPEND=PASS')
          PY
      - name: Live read-only platform contract probe
        env:
          PYTHONPATH: src
        run: timeout 120s python scripts/universal-radar-probe.py

  publish-live-radar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/pivot/universal-money-radar-r1'
    needs: radar-contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e .
      - name: Publish sanitized exact-head radar snapshot to existing observatory transport
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_SOURCE_SHA: ${{ github.sha }}
        run: timeout 150s python scripts/publish-universal-radar.py --publish
