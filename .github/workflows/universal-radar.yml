name: Universal Money Radar R1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --disable-pip-version-check -e .
      - name: Deterministic universal radar tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_*radar.py' -v
          python -m unittest discover -s tests -p 'test_superteam_agent.py' -v
      - name: Zero-spend static contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/universal-radar.json').read_text())
          assert cfg['outgoing_spend_usd'] == '0'
          assert cfg['paid_model_fallback'] is False
          assert cfg['single_supervisor'] is True
          assert cfg['specialist_worker_integrations'] == 'DEFERRED'
          print('UNIVERSAL_RADAR_ZERO_SPEND=PASS')
          PY
      - name: Live read-only platform contract probe
        env:
          PYTHONPATH: src
        run: timeout 90s python scripts/universal-radar-probe.py
