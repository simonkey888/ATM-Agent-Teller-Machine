name: ATM Cloudflare Deploy

on:
  push:
    branches: [agent/atm-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atm-cloudflare-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: atm-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Require Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy exact SHA
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var ATM_GIT_SHA:${{ github.sha }}
      - name: Exact-SHA smoke test
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time, urllib.parse
          base = "https://atm.simondalmasso44.workers.dev/health"
          expected = os.environ["EXPECTED_SHA"]
          last = None
          # Use curl with a normal explicit UA: workers.dev can reject the default
          # Python urllib user-agent even while the public endpoint is healthy.
          for attempt in range(60):
              url = base + "?" + urllib.parse.urlencode({"sha": expected, "attempt": attempt})
              try:
                  raw = subprocess.check_output(
                      ["curl", "-fsS", "--max-time", "15", "-A", "ATM-CI-Exact-SHA/1.0", "-H", "Cache-Control: no-cache", url],
                      text=True,
                      timeout=20,
                  )
                  last = json.loads(raw)
                  if last.get("ok") is True and last.get("git_sha") == expected:
                      print(json.dumps(last, sort_keys=True))
                      raise SystemExit(0)
              except Exception as exc:
                  last = {"error": str(exc)}
              time.sleep(3)
          raise SystemExit(f"Cloudflare exact-SHA smoke failed: {last}")
          PY
