name: ORDER-009-R2 Submit Once

on:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - .github/order009-r2-submit-trigger.txt

permissions:
  contents: read
  issues: write

concurrency:
  group: order009-r2-submit-once
  cancel-in-progress: false

jobs:
  submit-once:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TASK_ID: "0x664bc58934ca51fc34386bf58a5b1f0e6d4172e06c7df032d1c84b1d6960766c"
      EXPECTED_REWARD: "20000000"
      EXPECTED_NET: "18500000"
      EXPECTED_ESCROW: "0x851e545277b06d0b89fed66029e03bba92a24a5c4bf9002f6300ca4f044d41fc"
      TASKMARKET_KEYSTORE_B64: ${{ secrets.TASKMARKET_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Build deliverable gate
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/test_trenchguard_rh.py
          python scripts/order009-r2-artifact-check.py
          python - <<'PY'
          import json
          e=json.load(open("order009-r2-artifact-check.json"))
          assert e["pass"] is True
          print("ARTIFACT_CHECK=PASS")
          print("ARTIFACT_SHA256="+e["artifact_sha256"])
          PY

      - name: Live Robinhood Chain smoke
        run: |
          python deliverables/trenchguard_rh/trenchguard.py scan \
            0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73 > order009-r2-live-smoke.json
          python - <<'PY'
          import json
          p=json.load(open("order009-r2-live-smoke.json"))
          assert p["schema"]=="trenchguard-rh.v1"
          assert p["chain"]["chain_id"]==4663
          assert p["token"]["symbol"]=="WETH"
          assert p["deployment"]["creation_transaction_hash"]
          assert p["data_quality"]["complete"] is True, p["data_quality"]
          assert p["risk_summary"]["not_a_return_prediction"] is True
          print("LIVE_RH_SMOKE=PASS")
          PY

      - name: Final exact task re-fetch
        id: refetch
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          tid=os.environ["TASK_ID"]
          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"ATM-Order009-R2/submit-once"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode())
          task=get(f"https://api.taskmarket.dev/api/tasks/{tid}")
          subs=get(f"https://api.taskmarket.dev/api/tasks/{tid}/submissions")
          if isinstance(subs,dict):
              subs=subs.get("submissions") or subs.get("items") or subs.get("data") or []
          assert isinstance(subs,list)
          actions=task.get("pendingActions") or []
          submit_actions=[x for x in actions if isinstance(x,dict) and x.get("role")=="worker" and x.get("action")=="submit"]
          free_submit=bool(submit_actions) and all(x.get("requiresPayment") is False and x.get("paymentAmount") in (None,"",0,"0") for x in submit_actions)
          expiry=datetime.fromisoformat(str(task.get("expiryTime")).replace("Z","+00:00"))
          now=datetime.now(timezone.utc)
          gate={
            "task_id":tid,"fetched_at":now.isoformat(),"status":task.get("status"),"mode":task.get("mode"),
            "reward":str(task.get("reward")),"net_reward":str(task.get("netReward")),"escrow_tx":str(task.get("escrowTxHash")),
            "stake_required":bool(task.get("stakeRequired")),"submission_window_open":task.get("submissionWindowOpen") is True,
            "expiry":expiry.isoformat(),"expiry_future":expiry>now,"free_submit_action":free_submit,
            "submission_count_api":task.get("submissionCount"),"public_submission_rows_before":len(subs),
            "submission_ids_before":[str(x.get("id")) for x in subs if isinstance(x,dict) and x.get("id")],"entry_cost_usd":"0",
          }
          gate["pass"]=all([
              gate["status"]=="open",gate["mode"]=="bounty",gate["reward"]==os.environ["EXPECTED_REWARD"],
              gate["net_reward"]==os.environ["EXPECTED_NET"],gate["escrow_tx"].lower()==os.environ["EXPECTED_ESCROW"].lower(),
              gate["stake_required"] is False,gate["submission_window_open"],gate["expiry_future"],gate["free_submit_action"],
          ])
          open("order009-r2-final-refetch.json","w").write(json.dumps(gate,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"final_ok={str(gate['pass']).lower()}\n")
              out.write(f"count_before={len(subs)}\n")
          print("FINAL_REFETCH_OPEN="+str(gate["status"]=="open").lower())
          print("FINAL_REFETCH_SUBMISSION_WINDOW="+str(gate["submission_window_open"]).lower())
          print("ENTRY_COST_USD=0")
          PY

      - name: Install first-party Taskmarket CLI
        if: steps.refetch.outputs.final_ok == 'true'
        run: npm install -g @lucid-agents/taskmarket@latest >/tmp/taskmarket-npm.log 2>&1

      - name: Provision zero-cost worker identity and check legal receipt
        if: steps.refetch.outputs.final_ok == 'true'
        id: identity
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.taskmarket"
          if [ -n "${TASKMARKET_KEYSTORE_B64:-}" ]; then
            printf '%s' "$TASKMARKET_KEYSTORE_B64" | base64 --decode > "$HOME/.taskmarket/keystore.json"
            chmod 600 "$HOME/.taskmarket/keystore.json"
            IDENTITY_SOURCE=SECRET_KEYSTORE
          else
            taskmarket init >/tmp/taskmarket-init.json 2>/tmp/taskmarket-init.err
            IDENTITY_SOURCE=FRESH_PLATFORM_SPONSORED
          fi
          taskmarket address >/tmp/taskmarket-address.json 2>/tmp/taskmarket-address.err
          set +e
          taskmarket legal status >/tmp/taskmarket-legal.json 2>/tmp/taskmarket-legal.err
          LEGAL_RC=$?
          set -e
          export IDENTITY_SOURCE LEGAL_RC
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          def load(path):
              try: return json.loads(Path(path).read_text())
              except Exception: return {}
          def walk(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from walk(v)
              elif isinstance(o,list):
                  for v in o: yield from walk(v)
          ap=load("/tmp/taskmarket-address.json")
          address=None
          for d in walk(ap):
              for k in ("walletAddress","address"):
                  v=d.get(k)
                  if isinstance(v,str) and re.fullmatch(r"0x[0-9a-fA-F]{40}",v): address=v; break
              if address: break
          legal=load("/tmp/taskmarket-legal.json")
          accepted=False; enforcement=None; bundle=None
          for d in walk(legal):
              if "accepted" in d and isinstance(d.get("accepted"),bool):
                  accepted=d["accepted"]; enforcement=d.get("enforcementEnabled"); bundle=d.get("bundleVersion"); break
          evidence={"wallet_address":address,"identity_source":os.environ.get("IDENTITY_SOURCE","UNKNOWN"),
                    "legal_status_command_rc":int(os.environ.get("LEGAL_RC","0")),"legal_accepted":accepted,
                    "legal_enforcement_enabled":enforcement,"legal_bundle_version":bundle,
                    "can_submit":bool(address and accepted),"outgoing_spend_usd":"0"}
          Path("order009-r2-identity-gate.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("can_submit="+str(evidence["can_submit"]).lower()+"\n")
              out.write("worker_address="+(address or "")+"\n")
          print("TASKMARKET_IDENTITY="+("READY" if address else "FAILED"))
          print("TASKMARKET_LEGAL_ACCEPTED="+str(accepted).lower())
          PY

      - name: Submit exactly once
        if: steps.refetch.outputs.final_ok == 'true' && steps.identity.outputs.can_submit == 'true'
        id: submit
        run: |
          set +e
          taskmarket task submit "$TASK_ID" \
            --file deliverables/trenchguard_rh/RESEARCH.md \
            --file deliverables/trenchguard_rh/trenchguard.py \
            --file deliverables/trenchguard_rh/README.md \
            --file tests/test_trenchguard_rh.py \
            --file scripts/order009-r2-artifact-check.py \
            > order009-r2-submit-response.json 2>order009-r2-submit-stderr.txt
          RC=$?
          set -e
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "SUBMIT_COMMAND_INVOKED_EXACTLY_ONCE=true"
          echo "SUBMIT_RC=$RC"

      - name: Verify write or fail closed and publish durable receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_OK: ${{ steps.refetch.outputs.final_ok }}
          CAN_SUBMIT: ${{ steps.identity.outputs.can_submit }}
          WORKER_ADDRESS: ${{ steps.identity.outputs.worker_address }}
          SUBMIT_ATTEMPTED: ${{ steps.submit.outputs.attempted }}
          SUBMIT_RC: ${{ steps.submit.outputs.rc }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          tid=os.environ["TASK_ID"]
          def read_json(path,default=None):
              try: return json.loads(Path(path).read_text())
              except Exception: return default
          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"ATM-Order009-R2/verify"})
              with urllib.request.urlopen(req,timeout=20) as r: return json.loads(r.read().decode())
          artifact=read_json("order009-r2-artifact-check.json",{})
          refetch=read_json("order009-r2-final-refetch.json",{})
          identity=read_json("order009-r2-identity-gate.json",{})
          response=read_json("order009-r2-submit-response.json",{})
          before=set(refetch.get("submission_ids_before") or [])
          worker=(os.environ.get("WORKER_ADDRESS") or identity.get("wallet_address") or "").lower()
          attempted=(os.environ.get("SUBMIT_ATTEMPTED")=="true")
          task=None; subs=[]; verify_error=None
          try:
              task=get(f"https://api.taskmarket.dev/api/tasks/{tid}")
              subs=get(f"https://api.taskmarket.dev/api/tasks/{tid}/submissions")
              if isinstance(subs,dict): subs=subs.get("submissions") or subs.get("items") or subs.get("data") or []
              if not isinstance(subs,list): subs=[]
          except Exception as exc: verify_error=f"{type(exc).__name__}:{exc}"
          candidate=None; response_id=None
          def walk(o):
              if isinstance(o,dict):
                  yield o
                  for v in o.values(): yield from walk(v)
              elif isinstance(o,list):
                  for v in o: yield from walk(v)
          if response:
              for d in walk(response):
                  v=d.get("submissionId") or d.get("id")
                  if isinstance(v,str) and len(v)>=8:
                      response_id=v
                      if "submissionId" in d: break
          for row in subs:
              if not isinstance(row,dict): continue
              rid=str(row.get("id") or ""); rwa=str(row.get("workerAddress") or "").lower()
              if response_id and rid==response_id: candidate=row; break
              if worker and rwa==worker and rid and rid not in before: candidate=row; break
          submission_id=str(candidate.get("id")) if candidate else (response_id or "")
          verified=bool(candidate and worker and str(candidate.get("workerAddress") or "").lower()==worker)
          if verified: status="SUBMITTED"; failure=""
          elif os.environ.get("FINAL_OK")!="true": status="FAILED_CLOSED"; failure="FINAL_REFETCH_GATE_FAILED"
          elif os.environ.get("CAN_SUBMIT")!="true": status="FAILED_CLOSED"; failure="TASKMARKET_LEGAL_ACCEPTANCE_NOT_CURRENT"
          elif attempted: status="FAILED_CLOSED"; failure="SUBMISSION_NOT_VERIFIED_AFTER_SINGLE_ATTEMPT"
          else: status="FAILED_CLOSED"; failure="SUBMISSION_NOT_ATTEMPTED"
          receipt={"schema":"ATM_ORDER009_R2_REAL_WRITE_V1","status":status,"task_id":tid,"head":os.environ["GITHUB_SHA"],
                   "artifact":"deliverables/trenchguard_rh","artifact_sha256":artifact.get("artifact_sha256",""),
                   "artifact_check":"PASS" if artifact.get("pass") is True else "FAIL",
                   "final_refetch_open":refetch.get("status")=="open",
                   "final_refetch_submission_window":refetch.get("submission_window_open") is True,
                   "entry_cost_usd":"0","worker_address":worker,"submission_performed":attempted,
                   "submission_id":submission_id,"submission_verified":verified,
                   "submission_tx_or_commitment":(candidate or {}).get("submitTxHash") if candidate else None,
                   "submission_count_before":refetch.get("public_submission_rows_before"),
                   "submission_count_after":len(subs) if isinstance(subs,list) else None,
                   "post_submit_task_submission_count":task.get("submissionCount") if isinstance(task,dict) else None,
                   "verify_error":verify_error,"failure":failure,"outgoing_spend_usd":"0",
                   "realized_withdrawable_usd":"0","merge":False}
          Path("order009-r2-real-write-receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          body="ORDER-009-R2 REAL WRITE RECEIPT\n```json\n"+json.dumps(receipt,sort_keys=True)+"\n```"
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/38/comments",
              data=json.dumps({"body":body}).encode(),method="POST",
              headers={"Authorization":f"Bearer {os.environ['GITHUB_TOKEN']}","Accept":"application/vnd.github+json",
                       "Content-Type":"application/json","User-Agent":"ATM-Order009-R2/receipt"})
          with urllib.request.urlopen(req,timeout=20) as r: posted=json.loads(r.read().decode())
          print("RECEIPT_URL="+str(posted.get("html_url")))
          print("ORDER_009_R2_STATUS="+status)
          print("SUBMISSION_ID="+submission_id)
          print("SUBMISSION_VERIFIED="+str(verified).lower())
          print("OUTGOING_SPEND_USD=0")
          if not verified: raise SystemExit(1)
          PY
