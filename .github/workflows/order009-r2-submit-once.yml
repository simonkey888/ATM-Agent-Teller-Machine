name: ORDER-009-R2 Legacy Submit Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hard stop legacy economic path
        run: |
          echo "LEGACY_ORDER009_R2_SUBMIT=DISABLED"
          echo "TASKMARKET_INIT_PERFORMED=false"
          echo "ECONOMIC_WRITE_PERFORMED=false"
          echo "CANONICAL_TASKMARKET_WALLET=0xd89Ef03bC3105C538529AC2657Bc4488c94ff4E4"
          echo "NEXT=ORDER_009_R3"
