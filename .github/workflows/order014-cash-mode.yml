name: ORDER-014 Cash Mode

on:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - '.github/workflows/order014-cash-mode.yml'
      - '.github/atm-cloud-cycle-trigger.txt'
      - 'scripts/order014_cash_mode.py'
      - 'src/atm_core/cash_canon.py'
      - 'tests/test_order014_cash_canon.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: order014-single-cash-controller
  cancel-in-progress: false

jobs:
  cash-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact-head zero-spend preflight
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = "simonkey888/ATM-Agent-Teller-Machine"
          echo 'ORDER014_EXACT_HEAD=PASS'
          echo 'OUTGOING_SPEND_USD=0'
      - name: Install exact head
        run: python -m pip install --disable-pip-version-check -e .
      - name: Cash Canon regression and adversarial gates
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests.test_order014_cash_canon tests.test_order010_simon_gate -v
      - name: Fresh full inventory and individual-object scan
        env:
          PYTHONPATH: src:.
        run: python scripts/order014_cash_mode.py
      - name: Publish CASH MODE receipt
        if: github.event_name != 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          receipt=json.load(open('order014-cash-mode-receipt.json',encoding='utf-8'))
          receipt['run_id']=os.environ['GITHUB_RUN_ID']
          receipt['run_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body='ORDER-014 CASH MODE LIVE RECEIPT\n```json\n'+json.dumps(receipt,sort_keys=True)+'\n```'
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/41/comments",
            data=json.dumps({'body':body}).encode(),method='POST',
            headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'ATM-ORDER014/1.0'},
          )
          with urllib.request.urlopen(req,timeout=20) as r: posted=json.load(r)
          print('ORDER014_RECEIPT='+str(posted.get('html_url')))
          print('MODE='+str(receipt['mode']))
          print('EXECUTABLE_NOW='+str(receipt['executable_now']))
          print('OUTGOING_SPEND_USD=0')
          PY
