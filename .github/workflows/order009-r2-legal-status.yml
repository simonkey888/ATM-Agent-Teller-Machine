name: ORDER-009-R3 TaskMarket Identity Check

on:
  workflow_dispatch:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - .github/workflows/order009-r2-legal-status.yml

permissions:
  contents: read

jobs:
  identity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CANONICAL_WALLET: "0xd89Ef03bC3105C538529AC2657Bc4488c94ff4E4"
      TASKMARKET_CLI_PACKAGE: "@lucid-agents/taskmarket@1.11.0"
      TASKMARKET_CLI_INTEGRITY: "sha512-fZqaWpzcU5FftPMiZoA4guvAAgiNA4vbD7EVFtCKbQqofOfJhNRi84U3NY76tR5mg5//FcREZLtqy1G5V96fgQ=="
      TASKMARKET_KEYSTORE_B64: ${{ secrets.TASKMARKET_KEYSTORE_B64 }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Verify immutable TaskMarket CLI package
        run: |
          set -Eeuo pipefail
          observed="$(npm view "$TASKMARKET_CLI_PACKAGE" dist.integrity --json | python -c 'import json,sys; print(json.load(sys.stdin))')"
          test "$observed" = "$TASKMARKET_CLI_INTEGRITY"

      - name: Existing encrypted keystore only
        run: |
          set -Eeuo pipefail
          echo "TASKMARKET_INIT_PERFORMED=false"
          if [ -z "${TASKMARKET_KEYSTORE_B64:-}" ]; then
            echo "BLOCKED_CAPABILITY=TASKMARKET_KEYSTORE_B64"
            exit 0
          fi
          mkdir -p "$HOME/.taskmarket"
          printf '%s' "$TASKMARKET_KEYSTORE_B64" | base64 --decode > "$HOME/.taskmarket/keystore.json"
          chmod 600 "$HOME/.taskmarket/keystore.json"

      - name: Address bound to acting CLI wallet
        if: env.TASKMARKET_KEYSTORE_B64 != ''
        id: address
        run: |
          set -Eeuo pipefail
          npx -y --ignore-scripts "$TASKMARKET_CLI_PACKAGE" address > /tmp/address.json 2>/dev/null
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          obj=json.loads(Path('/tmp/address.json').read_text())
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          address=''
          for row in walk(obj):
              for key in ('address','walletAddress'):
                  value=row.get(key)
                  if isinstance(value,str) and re.fullmatch(r'0x[0-9A-Fa-f]{40}',value):
                      address=value; break
              if address: break
          match=bool(address and address.lower()==os.environ['CANONICAL_WALLET'].lower())
          print('TASKMARKET_ADDRESS='+(address or 'UNAVAILABLE'))
          print('WALLET_MATCH='+str(match).lower())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('match='+str(match).lower()+'\n')
          if not match: raise SystemExit('TASKMARKET_WALLET_MISMATCH')
          PY

      - name: Read-only legal status
        if: steps.address.outputs.match == 'true'
        run: |
          set -Eeuo pipefail
          npx -y --ignore-scripts "$TASKMARKET_CLI_PACKAGE" legal status > /tmp/legal.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('/tmp/legal.json').read_text())
          data=obj.get('data',obj) if isinstance(obj,dict) else {}
          print('TASKMARKET_LEGAL_ACCEPTED='+str(data.get('accepted') is True).lower())
          print('BUNDLE_VERSION='+str(data.get('bundleVersion') or data.get('version') or 'UNAVAILABLE'))
          print('BUNDLE_DIGEST='+str(data.get('bundleDigest') or 'UNAVAILABLE'))
          for i,d in enumerate((data.get('documents') or [])[:4],1): print(f'POLICY_URL_{i}='+str(d.get('url') or 'UNAVAILABLE'))
          print('LEGAL_ACCEPT_PERFORMED=false')
          print('EXTERNAL_ECONOMIC_WRITE=false')
          PY
