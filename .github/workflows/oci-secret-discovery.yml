name: OCI Secret Presence Discovery

on:
  push:
    branches: [agent/atm-v1]
    paths: [.github/oci-secret-discovery-trigger.txt]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ATM_AGENT_TELLER_MACHINE: ${{ secrets.ATM_AGENT_TELLER_MACHINE }}
      ATM_BOOTSTRAP_BUNDLE: ${{ secrets.ATM_BOOTSTRAP_BUNDLE }}
      ATM_BASE_WALLET_ADDRESS: ${{ secrets.ATM_BASE_WALLET_ADDRESS }}
      CANONICAL_ATM_PAYOUT_ADDRESS: ${{ secrets.CANONICAL_ATM_PAYOUT_ADDRESS }}
      GOOGLE_API_KEY_SECRET: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY_SECRET: ${{ secrets.GEMINI_API_KEY }}
      ATM_GITHUB_PAT: ${{ secrets.ATM_GITHUB_PAT }}
      GITHUB_PAT_SECRET: ${{ secrets.GITHUB_PAT }}
      GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Report non-sensitive presence classes only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import os,re
          names=[
            'ATM_BOOTSTRAP_BUNDLE','ATM_BASE_WALLET_ADDRESS','CANONICAL_ATM_PAYOUT_ADDRESS',
            'GOOGLE_API_KEY_SECRET','GEMINI_API_KEY_SECRET','ATM_GITHUB_PAT','GITHUB_PAT_SECRET','GH_TOKEN_SECRET'
          ]
          for n in names:
              v=os.environ.get(n,'')
              present=bool(v)
              wallet=bool(re.fullmatch(r'0x[0-9a-fA-F]{40}',v.strip())) if present else False
              bundle_wallet=bool(re.search(r'0x[0-9a-fA-F]{40}',v)) if present else False
              print(f'{n}=present:{str(present).lower()},wallet:{str(wallet).lower()},contains_wallet:{str(bundle_wallet).lower()}')
          v=os.environ.get('ATM_AGENT_TELLER_MACHINE','')
          print('ATM_AGENT_TELLER_MACHINE_CLASS=' + ','.join([
              'present:'+str(bool(v)).lower(),
              'wallet:'+str(bool(re.search(r'0x[0-9a-fA-F]{40}',v))).lower(),
              'github_pat:'+str(bool(re.search(r'(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})',v))).lower(),
              'google_key:'+str(bool(re.search(r'AIza[0-9A-Za-z_-]{20,}',v))).lower(),
              'pipes:'+str(v.count('|')),
              'lines:'+str(len([x for x in v.replace('\r','').split('\n') if x.strip()])),
          ]))
          PY
