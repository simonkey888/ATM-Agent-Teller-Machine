name: ORDER-021 Human Gate Live

on:
  push:
    branches: [pivot/universal-money-radar-r1]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: order021-human-gate-live
  cancel-in-progress: true

jobs:
  human-gate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact-head focused security kills
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install -e .
          PYTHONPATH=src python -m unittest tests.test_order021_human_gate -v
          node --check worker/src/order021-human-gate.js
          node --check worker/src/human-gate-entry.js
          ! grep -R -nE 'eth_sendTransaction|wallet_sendCalls|Permit2' worker/src/order021-human-gate.js
          echo "ORDER021_SECURITY_KILLS=PASS"
      - name: Wait exact Cloudflare + runtime=edge=radar
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://atm.simondalmasso44.workers.dev'; expected=os.environ['EXPECTED_SHA']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Accept':'application/json,text/html,*/*','Cache-Control':'no-cache','User-Agent':'ATM-ORDER021-Live/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r: return r.status,dict(r.headers),r.read().decode()
          last={}
          for i in range(160):
              try:
                  _,_,hraw=get('/health?order021='+str(i)); health=json.loads(hraw)
                  _,_,sraw=get('/api/status?order021='+str(i)); status=json.loads(sraw)
                  op=status.get('operational_status') or {}; radar=status.get('radar') or {}
                  last={'edge':health.get('git_sha'),'runtime':status.get('runtime_sha'),'radar':radar.get('source_sha'),'heartbeat':(op.get('checks') or {}).get('heartbeat_fresh')}
                  if health.get('git_sha')==expected and status.get('runtime_sha')==expected and radar.get('source_sha')==expected and (op.get('checks') or {}).get('heartbeat_fresh') is True:
                      print('ORDER021_RUNTIME_CONVERGENCE='+json.dumps(last,sort_keys=True)); break
              except Exception as exc: last={'error':type(exc).__name__+':'+str(exc)}
              time.sleep(4)
          else: raise SystemExit('ORDER021_RUNTIME_NOT_CONVERGED:'+json.dumps(last,sort_keys=True))
          PY
      - name: Live Human Gate + ORDER-020 non-regression proof
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          base='https://atm.simondalmasso44.workers.dev'
          def req(path,method='GET',body=None,headers=None):
              data=None if body is None else json.dumps(body).encode(); hs={'Accept':'application/json,text/html,*/*','Cache-Control':'no-cache','User-Agent':'ATM-ORDER021-Live/1.0'}; hs.update(headers or {})
              if data is not None: hs['Content-Type']='application/json'
              r=urllib.request.Request(base+path,data=data,method=method,headers=hs)
              try:
                  with urllib.request.urlopen(r,timeout=25) as x:return x.status,dict(x.headers),x.read().decode()
              except urllib.error.HTTPError as x:return x.code,dict(x.headers),x.read().decode()
          st,_,raw=req('/api/human-gates'); assert st==200; hg=json.loads(raw)
          assert hg['schema']=='ATM_HUMAN_GATE_PUBLIC_V1' and hg['pending_count']==0 and hg['owner_auth']=='EIP712_CANONICAL_METAMASK' and hg['outgoing_spend_usd']=='0'
          st,_,page=req('/'); assert st==200 and 'HUMAN GATE' in page and 'human-gate-badge' in page and 'max-width:100%' in page and '@media(max-width:520px)' in page
          st,_,raw=req('/api/human-gates/session-challenge'); assert st==200; ch=json.loads(raw); assert ch['canonical_wallet'].lower()=='0xd89ef03bc3105c538529ac2657bc4488c94ff4e4' and ch['typed_data']['primaryType']=='OwnerAction' and ch['typed_data']['message']['origin']==base and ch['typed_data']['domain']['chainId']==8453
          st,_,raw=req('/api/human-gates/not-a-gate/owner-action','POST',{}); assert st==401 and json.loads(raw)['error']=='owner_auth_required'
          st,_,raw=req('/x402/falsify','POST',{'bad':True}); assert st==402; challenge=json.loads(raw); accept=challenge['accepts'][0]; assert accept['network']=='eip155:8453' and accept['amount']=='10000' and accept['payTo'].lower()=='0xd89ef03bc3105c538529ac2657bc4488c94ff4e4'
          st,_,raw=req('/api/seller-funnel'); assert st==200 and str(json.loads(raw).get('outgoing_spend_usd'))=='0'
          print('ORDER021_LIVE_UI_API=PASS'); print('ORDER020_SELLER_NON_REGRESSION=PASS')
          PY
      - name: Prove no current zero-spend x402scan readback
        run: |
          python - <<'PY'
          import urllib.error, urllib.parse, urllib.request
          origin='https://atm.simondalmasso44.workers.dev'; url='https://www.x402scan.com/api/x402/registry/origin?'+urllib.parse.urlencode({'origin':origin})
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'ATM-ORDER021-Gate-Probe/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=25) as r: status=r.status
          except urllib.error.HTTPError as e: status=e.code
          if status != 402: raise SystemExit(f'X402SCAN_ZERO_COST_READBACK_ASSUMPTION_INVALID:http_{status}')
          print('X402SCAN_REGISTRY_READBACK_WITHOUT_PAYMENT=HTTP_402'); print('LIVE_REAL_GATE=NONE_CURRENT'); print('REAL_ZERO_COST_GATE_E2E=NONE_CURRENT_WITH_FIXTURE_PROOF')
          PY
      - name: Publish terminal durable ORDER-021 receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['FINAL_SHA']; run=os.environ['RUN_ID']
          receipt={'schema':'ATM_ORDER021_TERMINAL_V1','order':'ORDER-021','status':'READY_FOR_AUD','final_head':sha,'pr':37,'ci_focused_security':'PASS','cloudflare_exact_head':'PASS','edge_runtime_radar_exact':True,'heartbeat_fresh':True,'one_human_gate_inbox':True,'dashboard_human_gate_button':'PASS','pending_badge':'PASS','mobile_ui':'PASS','desktop_ui':'PASS','public_sanitization':'PASS','owner_auth_boundary':'EIP712_CANONICAL_METAMASK','canonical_wallet_binding':'PASS','signing_payload_boundary':'PASS','no_automatic_signature':True,'no_transaction_broadcast':True,'no_secret_leak':True,'dedupe':'PASS','external_readback_required':'PASS','automatic_resume_after_verified_gate':'FIXTURE_PROVEN','unrelated_lanes_continue':'PASS','real_zero_cost_gate_e2e':'NONE_CURRENT_WITH_FIXTURE_PROOF','real_gate_external_readback':'N/A','real_gate_resume':'N/A','order020_non_regression':'PASS','seller_live':True,'outgoing_spend_usd':'0','merge':'NO','run_id':run,'run_url':f'https://github.com/{repo}/actions/runs/{run}'}
          body='ATM ORDER021 TERMINAL\n```json\n'+json.dumps(receipt,sort_keys=True)+'\n```'
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/49/comments',data=json.dumps({'body':body}).encode(),method='POST',headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','User-Agent':'ATM-ORDER021-Terminal/1.0','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=20) as r: out=json.load(r)
          print('ORDER021_TERMINAL_RECEIPT='+str(out.get('html_url')))
          PY
