name: ORDER-020 Seller Live

on:
  push:
    branches: [pivot/universal-money-radar-r1]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: order020-seller-live
  cancel-in-progress: true

jobs:
  seller-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Exact-head live discovery registration and readback
        env:
          ATM_ORDER020_WAIT_SECONDS: '540'
          ATM_ORDER020_INDEX_WAIT_SECONDS: '420'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/order020_seller_live.py | tee /tmp/order020-seller-live.log

      - name: Publish durable ORDER-020 distribution receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request
          prefix = "ATM_ORDER020_SELLER_DISTRIBUTION="
          line = next((row for row in pathlib.Path('/tmp/order020-seller-live.log').read_text().splitlines() if row.startswith(prefix)), None)
          if not line:
              raise SystemExit('ORDER020_DISTRIBUTION_RECEIPT_MISSING')
          receipt = json.loads(line[len(prefix):])
          receipt['run_id'] = os.environ['RUN_ID']
          receipt['run_attempt'] = os.environ['RUN_ATTEMPT']
          receipt['run_url'] = f"https://github.com/simonkey888/ATM-Agent-Teller-Machine/actions/runs/{os.environ['RUN_ID']}"
          body = "ATM ORDER020 SELLER DISTRIBUTION LIVE\n```json\n" + json.dumps(receipt, sort_keys=True) + "\n```"
          req = urllib.request.Request(
              'https://api.github.com/repos/simonkey888/ATM-Agent-Teller-Machine/issues/48/comments',
              data=json.dumps({'body': body}).encode(),
              method='POST',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Content-Type':'application/json',
                  'User-Agent':'ATM-ORDER020-Distribution/1.0',
                  'X-GitHub-Api-Version':'2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data=json.load(response)
          print('ORDER020_DISTRIBUTION_COMMENT=' + str(data.get('html_url')))
          PY
