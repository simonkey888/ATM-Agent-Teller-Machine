name: ORDER-011 TaskMarket Next Submission

on:
  workflow_dispatch:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - .github/workflows/order009-r3-submit.yml
      - deliverables/taskmarket_whack_protocol/index.html
      - scripts/order009_r3_arcade_check.py
      - scripts/order009_r3_guard.py
      - src/atm_core/maker_router.py
      - src/atm_core/taskmarket_maker.py
      - tests/test_maker_fallback_gate.py

permissions:
  contents: read
  issues: write

concurrency:
  group: atm-economic-authority
  cancel-in-progress: false

jobs:
  submit-next:
    runs-on: ubuntu-latest
    environment: atm-production
    timeout-minutes: 12
    env:
      TASK_ID: "0x9e5a614a80fa0d0b802c21101cedb05ab06a0412edf7c4b874613f8c19f7d68c"
      CANONICAL_WALLET: "0xd89Ef03bC3105C538529AC2657Bc4488c94ff4E4"
      EXPECTED_REWARD: "6000000"
      EXPECTED_NET: "5550000"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install exact-head ATM runtime
        run: python -m pip install --disable-pip-version-check -e .

      - name: Exact-head maker structured-output regression
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=src python -m unittest tests.test_maker_fallback_gate -v
          echo "MAKER_STRUCTURED_OUTPUT_FAILOVER=PASS"
          echo "OWNER_ACTION_REQUIRED=NO"

      - name: Exact-head independent artifact check
        id: artifact
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/order009_r3_arcade_check.py
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('deliverables/taskmarket_whack_protocol/index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>',text,re.I)
          if len(scripts)!=1: raise SystemExit('INLINE_SCRIPT_COUNT_MISMATCH')
          Path('/tmp/game.js').write_text(scripts[0])
          PY
          node --check /tmp/game.js
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Public economic gate
        id: public
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.taskmarket.dev/api/tasks/{os.environ['TASK_ID']}"
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'ATM-ORDER011-submit/1'})
          with urllib.request.urlopen(req,timeout=20) as r: t=json.loads(r.read().decode())
          submit=[a for a in (t.get('pendingActions') or []) if isinstance(a,dict) and a.get('role')=='worker' and a.get('action')=='submit']
          free=bool(submit) and all(a.get('requiresPayment') is False and a.get('paymentAmount') in (None,'',0,'0') for a in submit)
          ok=all([t.get('status')=='open',t.get('mode')=='bounty',t.get('submissionWindowOpen') is True,t.get('stakeRequired') is False,str(t.get('reward'))==os.environ['EXPECTED_REWARD'],str(t.get('netReward'))==os.environ['EXPECTED_NET'],free])
          print('TASK_STATUS='+str(t.get('status')))
          print('SUBMISSION_COUNT='+str(t.get('submissionCount')))
          print('WORKER_SUBMIT_ACTION='+str(bool(submit)).lower())
          print('REQUIRES_PAYMENT='+str(not free).lower())
          print('ENTRY_COST_USD=0')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ok='+str(ok).lower()+'\n')
          if not ok: raise SystemExit('PUBLIC_SIDE_EFFECT_GATE_FAILED')
          PY

      - name: Existing encrypted keystore only
        id: key
        env:
          PYTHONPATH: src
          TASKMARKET_API_URL: https://api.taskmarket.dev
          TASKMARKET_KEYSTORE_B64: ${{ secrets.TASKMARKET_KEYSTORE_B64 }}
        run: |
          set -Eeuo pipefail
          if [ -z "${TASKMARKET_KEYSTORE_B64:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_CAPABILITY=TASKMARKET_KEYSTORE_B64"
            exit 0
          fi
          python - <<'PY'
          from atm_core.taskmarket_cli import materialize_supervisor_keystore
          result = materialize_supervisor_keystore()
          if not result.get('ready') or not result.get('transport_secret_removed'):
              raise SystemExit('TASKMARKET_SIGNER_BOOTSTRAP_FAILED')
          print('TASKMARKET_ENCRYPTED_KEYSTORE_MATERIALIZED=true')
          print('TASKMARKET_TRANSPORT_SECRET_REMOVED=true')
          PY
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Canonical wallet hard gate
        if: steps.key.outputs.present == 'true'
        id: wallet
        run: |
          set -Eeuo pipefail
          npx -y @lucid-agents/taskmarket@latest address > /tmp/address.json 2>/dev/null
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          obj=json.loads(Path('/tmp/address.json').read_text()); address=''
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          for row in walk(obj):
              for k in ('address','walletAddress'):
                  v=row.get(k)
                  if isinstance(v,str) and re.fullmatch(r'0x[0-9a-fA-F]{40}',v): address=v; break
              if address: break
          match=bool(address and address.lower()==os.environ['CANONICAL_WALLET'].lower())
          print('TASKMARKET_ADDRESS='+(address or 'UNAVAILABLE'))
          print('WALLET_MATCH='+str(match).lower())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('match='+str(match).lower()+'\n'); out.write('address='+address+'\n')
          if not match: raise SystemExit('TASKMARKET_WALLET_MISMATCH')
          PY

      - name: Current legal bundle gate
        if: steps.wallet.outputs.match == 'true'
        id: legal
        run: |
          set -Eeuo pipefail
          npx -y @lucid-agents/taskmarket@latest legal status > /tmp/legal.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from atm_core.taskmarket_cli import evaluate_taskmarket_legal_status
          obj=json.loads(Path('/tmp/legal.json').read_text()); data=obj.get('data',obj) if isinstance(obj,dict) else {}
          legal=evaluate_taskmarket_legal_status(data)
          print('LEGAL_WRITE_READY='+str(legal['write_ready']).lower())
          print('LEGAL_PARSE_OK='+str(legal['parse_ok']).lower())
          print('LEGAL_ACCEPTED='+str(legal['accepted']).lower())
          print('LEGAL_ENFORCEMENT_ENABLED='+str(legal['enforcement_enabled']).lower())
          print('LEGAL_STATUS='+legal['status'])
          print('BUNDLE_VERSION='+legal['bundle_version'])
          print('BUNDLE_DIGEST='+legal['bundle_digest'])
          for i,d in enumerate((data.get('documents') or [])[:4],1): print(f'POLICY_URL_{i}='+str(d.get('url') or 'UNAVAILABLE'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('write_ready='+str(legal['write_ready']).lower()+'\n')
              out.write('parse_ok='+str(legal['parse_ok']).lower()+'\n')
              out.write('accepted='+str(legal['accepted']).lower()+'\n')
              out.write('enforcement_enabled='+str(legal['enforcement_enabled']).lower()+'\n')
              out.write('status='+legal['status']+'\n')
              out.write('bundle_version='+legal['bundle_version']+'\n')
              out.write('bundle_digest='+legal['bundle_digest']+'\n')
              out.write('blocker='+legal['blocker']+'\n')
          if not legal['parse_ok']: raise SystemExit('TASKMARKET_LEGAL_STATUS_UNKNOWN')
          if not legal['write_ready']: raise SystemExit('TASKMARKET_LEGAL_ACCEPTANCE_REQUIRED')
          PY

      - name: First-party task gate
        if: steps.legal.outputs.write_ready == 'true'
        id: cli
        run: |
          set -Eeuo pipefail
          npx -y @lucid-agents/taskmarket@latest task get "$TASK_ID" > /tmp/task.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads(Path('/tmp/task.json').read_text());t=obj.get('data',obj) if isinstance(obj,dict) else {}
          submit=[a for a in (t.get('pendingActions') or []) if isinstance(a,dict) and a.get('role')=='worker' and a.get('action')=='submit']
          free=bool(submit) and all(a.get('requiresPayment') is False and a.get('paymentAmount') in (None,'',0,'0') for a in submit)
          ok=bool(t.get('status')=='open' and t.get('submissionWindowOpen') is True and t.get('stakeRequired') is False and free)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ok='+str(ok).lower()+'\n')
          print('FIRST_PARTY_SIDE_EFFECT_GATE='+str(ok).lower())
          if not ok: raise SystemExit('FIRST_PARTY_SIDE_EFFECT_GATE_FAILED')
          PY

      - name: Duplicate guard for canonical wallet
        if: steps.cli.outputs.ok == 'true'
        id: duplicate
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,os,urllib.request
          url=f"https://api.taskmarket.dev/api/tasks/{os.environ['TASK_ID']}/submissions"
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'ATM-ORDER011-duplicate/1'})
          with urllib.request.urlopen(req,timeout=20) as r: rows=json.loads(r.read().decode())
          if isinstance(rows,dict): rows=rows.get('submissions') or rows.get('items') or rows.get('data') or []
          found=''
          for row in rows if isinstance(rows,list) else []:
              if isinstance(row,dict) and str(row.get('workerAddress') or '').lower()==os.environ['CANONICAL_WALLET'].lower():
                  found=str(row.get('id') or row.get('submissionId') or '');break
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('exists='+str(bool(found)).lower()+'\n');out.write('id='+found+'\n')
          print('DUPLICATE_EXISTS='+str(bool(found)).lower())
          print('EXISTING_SUBMISSION_ID='+found)
          PY

      - name: Final first-party re-fetch
        if: steps.cli.outputs.ok == 'true' && steps.duplicate.outputs.exists != 'true'
        id: final
        run: |
          set -Eeuo pipefail
          npx -y @lucid-agents/taskmarket@latest task get "$TASK_ID" > /tmp/final-task.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads(Path('/tmp/final-task.json').read_text());t=obj.get('data',obj) if isinstance(obj,dict) else {}
          submit=[a for a in (t.get('pendingActions') or []) if isinstance(a,dict) and a.get('role')=='worker' and a.get('action')=='submit']
          free=bool(submit) and all(a.get('requiresPayment') is False and a.get('paymentAmount') in (None,'',0,'0') for a in submit)
          ok=bool(t.get('status')=='open' and t.get('submissionWindowOpen') is True and t.get('stakeRequired') is False and free)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('ok='+str(ok).lower()+'\n')
          print('FINAL_SIDE_EFFECT_GATE='+str(ok).lower())
          print('FINAL_REQUIRES_PAYMENT='+str(not free).lower())
          if not ok: raise SystemExit('FINAL_SIDE_EFFECT_GATE_FAILED')
          PY

      - name: Submit exactly once
        if: steps.final.outputs.ok == 'true'
        id: submit
        run: |
          set +e
          npx -y @lucid-agents/taskmarket@latest task submit "$TASK_ID" --file deliverables/taskmarket_whack_protocol/index.html > /tmp/submit.json 2>/tmp/submit.err
          rc=$?
          set -e
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "SUBMIT_COMMAND_INVOKED_EXACTLY_ONCE=true"
          echo "SUBMIT_RC=$rc"

      - name: Verify and publish ORDER-012 receipts
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEY_PRESENT: ${{ steps.key.outputs.present }}
          WALLET_MATCH: ${{ steps.wallet.outputs.match }}
          LEGAL_WRITE_READY: ${{ steps.legal.outputs.write_ready }}
          LEGAL_PARSE_OK: ${{ steps.legal.outputs.parse_ok }}
          LEGAL_ACCEPTED: ${{ steps.legal.outputs.accepted }}
          LEGAL_ENFORCEMENT_ENABLED: ${{ steps.legal.outputs.enforcement_enabled }}
          LEGAL_STATUS: ${{ steps.legal.outputs.status }}
          LEGAL_BUNDLE_VERSION: ${{ steps.legal.outputs.bundle_version }}
          LEGAL_BUNDLE_DIGEST: ${{ steps.legal.outputs.bundle_digest }}
          LEGAL_BLOCKER: ${{ steps.legal.outputs.blocker }}
          DUPLICATE_EXISTS: ${{ steps.duplicate.outputs.exists }}
          DUPLICATE_ID: ${{ steps.duplicate.outputs.id }}
          SUBMIT_ATTEMPTED: ${{ steps.submit.outputs.attempted }}
          ARTIFACT_OK: ${{ steps.artifact.outputs.ok }}
          PUBLIC_OK: ${{ steps.public.outputs.ok }}
          FINAL_OK: ${{ steps.final.outputs.ok }}
        run: |
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          tid=os.environ['TASK_ID']; wallet=os.environ['CANONICAL_WALLET'].lower();artifact=Path('deliverables/taskmarket_whack_protocol/index.html');sha=hashlib.sha256(artifact.read_bytes()).hexdigest()
          req=urllib.request.Request(f'https://api.taskmarket.dev/api/tasks/{tid}/submissions',headers={'Accept':'application/json','User-Agent':'ATM-ORDER011-verify/1'})
          with urllib.request.urlopen(req,timeout=20) as r: rows=json.loads(r.read().decode())
          if isinstance(rows,dict): rows=rows.get('submissions') or rows.get('items') or rows.get('data') or []
          candidate=None
          for row in rows if isinstance(rows,list) else []:
              if isinstance(row,dict) and str(row.get('workerAddress') or '').lower()==wallet:
                  candidate=row;break
          sid=str(candidate.get('id') or candidate.get('submissionId') or '') if candidate else ''
          manifest_ok=False
          if sid:
              try:
                  mreq=urllib.request.Request(f'https://api.taskmarket.dev/api/tasks/{tid}/submissions/{sid}/manifest',headers={'Accept':'application/json','User-Agent':'ATM-ORDER011-verify/1'})
                  with urllib.request.urlopen(mreq,timeout=20) as r:m=json.loads(r.read().decode())
                  manifest_ok=any(isinstance(a,dict) and str(a.get('sha256Hash') or '').lower()==sha for a in (m.get('artifacts') or []))
              except Exception: pass
          verified=bool(candidate and sid and manifest_ok)
          if verified: state='SUBMITTED'; blocker=''
          elif os.environ.get('KEY_PRESENT')!='true': state='BLOCKED_CAPABILITY';blocker='TASKMARKET_KEYSTORE_B64'
          elif os.environ.get('WALLET_MATCH')!='true': state='FAILED_CLOSED';blocker='TASKMARKET_WALLET_MISMATCH'
          elif os.environ.get('LEGAL_WRITE_READY')!='true': state='FAILED_CLOSED';blocker=os.environ.get('LEGAL_BLOCKER') or 'TASKMARKET_LEGAL_STATUS_UNKNOWN'
          else: state='FAILED_CLOSED';blocker='SUBMISSION_NOT_VERIFIED'
          task_req=urllib.request.Request(f'https://api.taskmarket.dev/api/tasks/{tid}',headers={'Accept':'application/json','User-Agent':'ATM-ORDER012-task/1'})
          with urllib.request.urlopen(task_req,timeout=20) as r: task=json.loads(r.read().decode())
          awards=[a for a in (task.get('awards') or []) if isinstance(a,dict) and str(a.get('workerAddress') or '').lower()==wallet]
          funding_verified=bool(task.get('escrowTxHash') and str(task.get('reward') or '0')!='0')
          try:
              status_req=urllib.request.Request('https://atm.simondalmasso44.workers.dev/api/status',headers={'Accept':'application/json','User-Agent':'ATM-ORDER012-runtime/1'})
              with urllib.request.urlopen(status_req,timeout=20) as r: runtime=json.loads(r.read().decode())
          except Exception:
              runtime={}
          autonomous_continues=runtime.get('state')=='RUNNING' and runtime.get('phase')=='DISCOVER'
          repair={
              'schema':'ATM_ORDER012_REPAIR_V1','head':os.environ['GITHUB_SHA'],
              'taskmarket_environment':'atm-production','signer_bootstrap':'ENCRYPTED_B64_TO_PRIVATE_HOME',
              'transport_secret_removed_before_untrusted_lanes':True,'canonical_wallet':os.environ['CANONICAL_WALLET'],
              'watcher_real_seam_regression':True,'workprotocol_ephemeral_registration_disabled':True,
              'false_legal_gate_corrected_from_aud_comment':5354754294,
              'single_economic_concurrency_group':'atm-economic-authority','outgoing_spend_usd':'0'
          }
          integrated={
              'schema':'ATM_ORDER012_INTEGRATED_VERIFY_V1','head':os.environ['GITHUB_SHA'],
              'artifact_check_passed':os.environ.get('ARTIFACT_OK')=='true','public_current_gate_passed':os.environ.get('PUBLIC_OK')=='true',
              'encrypted_keystore_present':os.environ.get('KEY_PRESENT')=='true','canonical_wallet_verified':os.environ.get('WALLET_MATCH')=='true',
              'legal_write_ready':os.environ.get('LEGAL_WRITE_READY')=='true','legal_accepted':os.environ.get('LEGAL_ACCEPTED')=='true',
              'legal_enforcement_enabled':os.environ.get('LEGAL_ENFORCEMENT_ENABLED')=='true','legal_status':os.environ.get('LEGAL_STATUS'),
              'legal_bundle_version':os.environ.get('LEGAL_BUNDLE_VERSION'),'legal_bundle_digest':os.environ.get('LEGAL_BUNDLE_DIGEST'),
              'final_free_submit_gate_passed':os.environ.get('FINAL_OK')=='true',
              'submission_verified':verified,'outgoing_spend_usd':'0'
          }
          live={
              'schema':'ATM_ORDER012_LIVE_EXECUTION_V1','head':os.environ['GITHUB_SHA'],'source':'taskmarket',
              'opportunity_id':tid,'external_url':f'https://taskmarket.dev/tasks/{tid}','funding_verified':funding_verified,
              'zero_spend':True,'canonical_identity_verified':os.environ.get('WALLET_MATCH')=='true',
              'execution_stage':'SUBMITTED' if verified else 'NOT_ENTERED','claim_id':None,'submission_id':sid or None,
              'artifact_sha256':sha,'in_flight_persisted':verified,
              'in_flight_store':'github_issue_39_order012_live_receipt' if verified else None,
              'in_flight':{'stage':'SUBMITTED','submission_id':sid,'worker_address':os.environ['CANONICAL_WALLET']} if verified else None,
              'autonomous_lane_continues':autonomous_continues,'realized_withdrawable_usd':'0','outgoing_spend_usd':'0',
              'state':state,'blocker':blocker or None,'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }
          payment={
              'schema':'ATM_ORDER012_PAYMENT_STATE_V1','head':os.environ['GITHUB_SHA'],'source':'taskmarket','opportunity_id':tid,
              'submission_id':sid or None,'platform_award_count_for_canonical_wallet':len(awards),
              'stage':'ACCEPTED' if awards else ('SUBMITTED' if verified else state),'settlement_tx_hashes':[str(a.get('settlementTxHash')) for a in awards if a.get('settlementTxHash')],
              'realized_withdrawable_usd':'0','outgoing_spend_usd':'0'
          }
          headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'ATM-ORDER011-receipt/1'}
          receipts=[('ATM ORDER-012 REPAIR',repair),('ATM ORDER-012 INTEGRATED VERIFY',integrated)]
          if verified:
              receipts.extend([('ATM ORDER-012 LIVE EXECUTION',live),('ATM ORDER-012 PAYMENT STATE',payment)])
          else:
              receipts.append(('ATM ORDER-012 BLOCKED REAL',{
                  'schema':'ATM_ORDER012_BLOCKED_REAL_V1','head':os.environ['GITHUB_SHA'],'source':'taskmarket',
                  'opportunity_id':tid,'state':state,'blocker':blocker,'execution_stage':'NOT_ENTERED',
                  'realized_withdrawable_usd':'0','outgoing_spend_usd':'0',
                  'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              }))
          for title,receipt in receipts:
              body=title+'\n```json\n'+json.dumps(receipt,sort_keys=True)+'\n```'
              preq=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/39/comments",data=json.dumps({'body':body}).encode(),method='POST',headers=headers)
              with urllib.request.urlopen(preq,timeout=20) as r:posted=json.loads(r.read().decode())
              print(title.replace(' ','_')+'_COMMENT='+str(posted.get('id') or ''))
          print('ORDER_012_TASKMARKET_STATE='+state)
          print('ORDER_012_SUBMISSION_ID='+sid)
          print('ORDER_012_SUBMISSION_VERIFIED='+str(verified).lower())
          print('REALIZED_WITHDRAWABLE_USD=0')
          print('OUTGOING_SPEND_USD=0')
          print('OWNER_ACTION_REQUIRED=NO')
          if not verified:
              raise SystemExit('ORDER012_LIVE_SUBMISSION_NOT_VERIFIED:'+blocker)
          PY
