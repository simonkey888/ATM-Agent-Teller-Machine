name: ORDER-009-R3 Economic Guard

on:
  workflow_dispatch:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - .github/workflows/order009-r3-guard.yml
      - .github/workflows/order009-r3-submit.yml
      - .github/workflows/order009-r2-legal-status.yml
      - .github/workflows/order009-r2-submit-once.yml
      - scripts/order009_r3_guard.py
      - scripts/order009_r3_arcade_check.py
      - scripts/order009_r3_money_monitor.py
      - state/order009_r3_money_ledger.json
      - worker/src/index.js
      - deliverables/taskmarket_whack_protocol/index.html

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Exact head
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "TESTED_SHA_EQ_HEAD=PASS"
      - name: R3 economic falsification
        run: python scripts/order009_r3_guard.py
      - name: Next artifact independent check
        run: python scripts/order009_r3_arcade_check.py
      - name: Worker syntax
        run: node --check worker/src/index.js
      - name: Zero spend receipt
        run: |
          echo "OUTGOING_SPEND_USD=0"
          echo "ECONOMIC_GUARD=PASS"
