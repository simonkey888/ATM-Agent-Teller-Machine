name: ORDER-009-R3A Autopilot Shadow

on:
  workflow_dispatch:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - .github/workflows/order009-r3a-shadow.yml
      - scripts/order009_r3a_shadow.py
      - src/atm_core/taskmarket_cli.py
      - src/atm_core/effect_boundary.py
      - src/atm_core/taskmarket_maker.py
      - src/atm_core/opportunities.py
      - src/atm.py
      - config/atm.example.json
      - tests/test_taskmarket_autopilot.py
      - tests/test_taskmarket_autopilot_negatives.py

permissions:
  contents: read
  issues: write

concurrency:
  group: order009-r3a-autopilot-shadow
  cancel-in-progress: true

jobs:
  runtime-selected-maker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ATM_GEMMA4_FREE_MODEL: gemma-4-31b-it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install exact head
        run: python -m pip install --disable-pip-version-check -e .
      - name: R3A adversarial contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_taskmarket_autopilot tests.test_taskmarket_autopilot_negatives -v
      - name: Runtime-selected zero-cost maker/checker shadow
        env:
          PYTHONPATH: src
        run: |
          set -Eeuo pipefail
          test -n "$GEMINI_API_KEY"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/order009_r3a_shadow.py
      - name: Publish sanitized exact-head acceptance evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          receipt=json.loads(Path('order009-r3a-shadow.json').read_text())
          assert receipt['head']==os.environ['GITHUB_SHA']
          assert receipt['taskmarket_mutation'] is False
          assert receipt['outgoing_spend_usd']=='0'
          assert receipt['admission_mode']=='SHADOW_BENCHMARK'
          assert receipt['signer_visible'] is False
          assert receipt['economic_state_unchanged'] is True
          assert receipt['not_counted_as_execution'] is True
          if receipt.get('allocation_allowed', True):
              assert receipt['task_selected_by_runtime'] is True
              assert receipt['zero_cost_executor'] is True
              assert receipt['independent_checker']=='PASS'
          else:
              assert receipt['maker_invoked'] is False
          body='ORDER-009-R3A ZERO-COST AUTOPILOT SHADOW\n```json\n'+json.dumps(receipt,sort_keys=True)+'\n```'
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/38/comments",
              data=json.dumps({'body':body}).encode(), method='POST',
              headers={
                  'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'User-Agent':'ATM-ORDER009-R3A-shadow/1',
              },
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              posted=json.loads(response.read().decode())
          print('R3A_EVIDENCE_COMMENT='+str(posted.get('id') or ''))
          print('OUTGOING_SPEND_USD=0')
          PY
