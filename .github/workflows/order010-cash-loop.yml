name: ORDER-010 Nonblocking Cash Loop

on:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - '.github/workflows/order010-cash-loop.yml'
      - 'scripts/order010_workprotocol_live.py'
      - 'deliverables/workprotocol_gha_log_parser/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: order010-cash-loop
  cancel-in-progress: false

jobs:
  workprotocol-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact-head and zero-spend preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/atm.example.json').read_text())
          assert cfg['outgoing_spend_usd'] == 0
          assert cfg['zero_cost_models']['paid_fallback'] is False
          assert cfg['taskmarket_autopilot']['paid_fallback'] is False
          assert cfg['payment_recipient_public_identifier'].lower() == '0xd89ef03bc3105c538529ac2657bc4488c94ff4e4'
          print('ORDER010_EXACT_HEAD=PASS')
          print('OUTGOING_SPEND_USD=0')
          print('PAID_MODEL_FALLBACK=FORBIDDEN')
          PY
      - name: Install validation tooling
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check "pylint>=3,<5"
      - name: Self-contained deliverable acceptance
        working-directory: deliverables/workprotocol_gha_log_parser
        run: |
          python -m pip install --disable-pip-version-check .
          python -m unittest -v test_cli.py
          python -m pylint cli.py --fail-under=8.0
          gha-log-parser --help >/dev/null
      - name: Existing independent integration acceptance
        env:
          PYTHONPATH: src:.
        run: python -m unittest tests.test_order009_r1_deliverable -v
      - name: Execute real WorkProtocol claim-deliver-verify lane
        id: economic
        env:
          PYTHONPATH: src:.
          ORDER010_HEAD: ${{ github.sha }}
          ORDER010_EXPECTED_HEAD: ${{ github.sha }}
        run: python scripts/order010_workprotocol_live.py
      - name: Publish sanitized durable receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEP_OUTCOME: ${{ steps.economic.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          path=Path('order010-workprotocol-receipt.json')
          if path.exists():
              receipt=json.loads(path.read_text())
          else:
              receipt={
                  'schema':'ATM_ORDER010_WORKPROTOCOL_LIVE_V1',
                  'head':os.environ['GITHUB_SHA'],
                  'step_outcome':os.environ.get('STEP_OUTCOME','unknown'),
                  'receipt_missing':True,
                  'realized_withdrawable_usd':'0',
                  'outgoing_spend_usd':'0',
              }
          receipt['run_id']=os.environ['GITHUB_RUN_ID']
          receipt['run_attempt']=os.environ['GITHUB_RUN_ATTEMPT']
          receipt['run_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body='ORDER-010 WORKPROTOCOL LIVE RECEIPT\n```json\n'+json.dumps(receipt,sort_keys=True)+'\n```'
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/38/comments",
              data=json.dumps({'body':body}).encode(), method='POST',
              headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'ATM-Order010/1.0'},
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              posted=json.loads(r.read().decode())
          print('ORDER010_WORKPROTOCOL_RECEIPT='+str(posted.get('html_url')))
          print('REALIZED_WITHDRAWABLE_USD='+str(receipt.get('realized_withdrawable_usd','0')))
          print('OUTGOING_SPEND_USD=0')
          PY

  lane-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TASKBOUNTY_API_KEY: ${{ secrets.TASKBOUNTY_API_KEY }}
      SUPERTEAM_AGENT_API_KEY: ${{ secrets.SUPERTEAM_AGENT_API_KEY }}
      TASKMARKET_KEYSTORE_B64: ${{ secrets.TASKMARKET_KEYSTORE_B64 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Probe independent rails without mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          def get(url, token=None):
              h={'Accept':'application/json','User-Agent':'ATM-Order010-Probe/1.0'}
              if token: h['Authorization']='Bearer '+token
              req=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code,{}
              except Exception:
                  return 0,{}
          tb=os.environ.get('TASKBOUNTY_API_KEY','').strip()
          st=os.environ.get('SUPERTEAM_AGENT_API_KEY','').strip()
          out={
              'schema':'ATM_ORDER010_LANE_PROBE_V1',
              'taskbounty_secret_present':bool(tb),
              'superteam_secret_present':bool(st),
              'taskmarket_keystore_present':bool(os.environ.get('TASKMARKET_KEYSTORE_B64','').strip()),
              'gemini_secret_present':bool(os.environ.get('GEMINI_API_KEY','').strip()),
              'outgoing_spend_usd':'0',
          }
          status,payload=get('https://www.task-bounty.com/api/v1/tasks',tb or None)
          rows=payload.get('data') if isinstance(payload,dict) else []
          out['taskbounty_http']=status
          out['taskbounty_open_count']=len(rows) if isinstance(rows,list) else 'UNKNOWN'
          if st:
              status,payload=get('https://superteam.fun/api/agents/listings/live?take=50',st)
              rows=payload.get('listings') or payload.get('data') if isinstance(payload,dict) else []
              out['superteam_http']=status
              out['superteam_returned_count']=len(rows) if isinstance(rows,list) else 'UNKNOWN'
              if isinstance(rows,list):
                  out['superteam_agent_only_count']=sum(1 for x in rows if isinstance(x,dict) and str(x.get('agentAccess') or '').upper()=='AGENT_ONLY')
                  out['superteam_agent_allowed_count']=sum(1 for x in rows if isinstance(x,dict) and str(x.get('agentAccess') or '').upper()=='AGENT_ALLOWED')
          print(json.dumps(out,sort_keys=True))
          PY
