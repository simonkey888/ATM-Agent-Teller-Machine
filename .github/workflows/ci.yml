name: ATM CI

on:
  push:
    branches: [main, agent/atm-v1]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: OCI shell syntax
        run: bash -n scripts/bootstrap-oci-atm.sh scripts/bootstrap-oci-atm-api.sh scripts/github-oci-bootstrap.sh scripts/mobile-oci-bootstrap.sh scripts/oci-provision.sh scripts/oci-provision-runner.sh scripts/oci-configure.sh scripts/atm-state-backup.sh deploy/oci/cloud-init.sh
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Canonical Windows status smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-atm.ps1 -Status

  r3a-autopilot-shadow:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'simonkey888' &&
      github.head_ref == 'pivot/universal-money-radar-r1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ATM_GEMMA4_FREE_MODEL: gemma-4-31b-it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact PR head
        run: python -m pip install --disable-pip-version-check -e .
      - name: R3A mandatory adversarial controls
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.test_taskmarket_autopilot tests.test_taskmarket_autopilot_negatives -v
          python -m unittest tests.test_maker_fallback_gate -v
      - name: AUD maker fallback credential gate
        env:
          PYTHONPATH: src
        run: |
          set -Eeuo pipefail
          test -n "$GEMINI_API_KEY"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          ! grep -qE '^  models: read$' .github/workflows/ci.yml
          ! grep -q 'GROQ_API_KEY' src/atm_core/maker_router.py
          ! grep -q 'CEREBRAS_API_KEY' src/atm_core/maker_router.py
          python scripts/order010_maker_fallback_gate.py
      - name: Fresh runtime-selected zero-cost WORK/CHECK shadow
        env:
          PYTHONPATH: src
        run: |
          set -Eeuo pipefail
          test -n "$GEMINI_API_KEY"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python scripts/order009_r3a_shadow.py

  order016-live-proof:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'simonkey888' &&
      github.head_ref == 'pivot/universal-money-radar-r1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [linux, windows, r3a-autopilot-shadow]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact-head production health status and money truth
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          ATM_BASE_URL: https://atm.simondalmasso44.workers.dev
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, time, urllib.request

          base=os.environ['ATM_BASE_URL'].rstrip('/')
          expected=os.environ['EXPECTED_SHA']
          deadline=time.time()+300
          last=None
          def get(path):
              req=urllib.request.Request(base+path, headers={'User-Agent':'ATM-ORDER016-LiveProof/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          while time.time()<deadline:
              try:
                  health=get('/health')
                  if health.get('git_sha') == expected:
                      last=health
                      break
                  last=health
              except Exception as exc:
                  last={'error':type(exc).__name__}
              time.sleep(10)
          if not isinstance(last, dict) or last.get('git_sha') != expected:
              raise SystemExit(f'LIVE_SHA_EXACT=FAIL expected={expected} last={last}')
          status=get('/api/status')
          board=get('/api/money-board')
          capabilities=get('/api/capabilities')
          providers=get('/api/providers')
          op=last.get('status') or {}
          checks=op.get('checks') or {}
          assert last.get('ok') is True, last
          assert checks.get('heartbeat_fresh') is True, checks
          assert checks.get('version_coherent') is True, checks
          assert checks.get('radar_current') is True, checks
          evidence=board.get('evidence') or {}
          assert str(evidence.get('outgoing_spend_usd','0')) == '0', evidence
          print('LIVE_SHA_EXACT=PASS', expected)
          print('HEALTH=' + json.dumps(last, sort_keys=True))
          print('STATUS=' + json.dumps(status, sort_keys=True))
          print('MONEY_BOARD=' + json.dumps(board, sort_keys=True))
          print('CAPABILITIES=' + json.dumps(capabilities, sort_keys=True))
          print('PROVIDERS=' + json.dumps(providers, sort_keys=True))
          PY
