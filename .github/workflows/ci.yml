name: ATM CI

on:
  push:
    branches: [main, agent/atm-v1]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: OCI shell syntax
        run: bash -n scripts/bootstrap-oci-atm.sh scripts/bootstrap-oci-atm-api.sh scripts/github-oci-bootstrap.sh scripts/mobile-oci-bootstrap.sh scripts/oci-provision.sh scripts/oci-provision-runner.sh scripts/oci-configure.sh scripts/atm-state-backup.sh deploy/oci/cloud-init.sh
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Canonical Windows status smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-atm.ps1 -Status
