name: ATM CI

on:
  push:
    branches: [main, agent/atm-v1]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head binding
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          echo "TESTED_SHA=$TESTED_SHA"
          echo "FINAL_PR_HEAD_SHA=$EXPECTED_SHA"
          test "$TESTED_SHA" = "$EXPECTED_SHA"
          echo 'TESTED_SHA_EQ_FINAL_PR_HEAD=PASS'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: OCI shell syntax
        run: bash -n scripts/bootstrap-oci-atm.sh scripts/bootstrap-oci-atm-api.sh scripts/github-oci-bootstrap.sh scripts/mobile-oci-bootstrap.sh scripts/oci-provision.sh scripts/oci-provision-runner.sh scripts/oci-configure.sh scripts/atm-state-backup.sh deploy/oci/cloud-init.sh
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head binding
        shell: powershell
        run: |
          $tested = (git rev-parse HEAD).Trim()
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          Write-Output "TESTED_SHA=$tested"
          Write-Output "FINAL_PR_HEAD_SHA=$expected"
          if ($tested -ne $expected) { throw "TESTED_SHA mismatch" }
          Write-Output "TESTED_SHA_EQ_FINAL_PR_HEAD=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Canonical Windows status smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-atm.ps1 -Status
