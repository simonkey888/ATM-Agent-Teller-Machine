name: ATM CI

on:
  push:
    branches: [main, agent/atm-v1]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: OCI shell syntax
        run: bash -n scripts/bootstrap-oci-atm.sh scripts/bootstrap-oci-atm-api.sh scripts/github-oci-bootstrap.sh scripts/mobile-oci-bootstrap.sh scripts/oci-provision.sh scripts/oci-provision-runner.sh scripts/oci-configure.sh scripts/atm-state-backup.sh deploy/oci/cloud-init.sh
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Canonical Windows status smoke
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-atm.ps1 -Status

  r3a-autopilot-shadow:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'simonkey888' &&
      github.head_ref == 'pivot/universal-money-radar-r1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ATM_GEMMA4_FREE_MODEL: gemma-4-31b-it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact PR head
        run: python -m pip install --disable-pip-version-check -e .
      - name: R3A mandatory adversarial controls
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_taskmarket_autopilot tests.test_taskmarket_autopilot_negatives -v
      - name: Fresh runtime-selected zero-cost WORK/CHECK shadow
        env:
          PYTHONPATH: src
        run: |
          set -Eeuo pipefail
          test -n "$GEMINI_API_KEY"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python scripts/order009_r3a_shadow.py
