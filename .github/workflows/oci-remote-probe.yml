name: OCI Remote Probe

on:
  push:
    branches: [agent/atm-v1]
    paths: [.github/oci-remote-trigger.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_CONFIG_SECRET: ${{ secrets.OCI_CONFIG }}
      OCI_PRIVATE_KEY_PEM: ${{ secrets.OCI_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Require OCI secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OCI_CONFIG_SECRET"
          test -n "$OCI_PRIVATE_KEY_PEM"
      - name: Install OCI CLI
        run: python3 -m pip install --disable-pip-version-check oci-cli
      - name: Prepare temporary OCI profile
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_PRIVATE_KEY_PEM" > "$HOME/.oci/oci_api_key.pem"
          printf '%s\n' "$OCI_CONFIG_SECRET" > "$HOME/.oci/config.raw"
          python3 - <<'PY'
          from pathlib import Path
          src = Path.home()/'.oci'/'config.raw'
          dst = Path.home()/'.oci'/'config'
          lines = src.read_text().splitlines()
          out=[]
          saw_profile=False
          saw_key=False
          for line in lines:
              if line.strip() == '[DEFAULT]':
                  out.append('[ATM_REMOTE]')
                  saw_profile=True
              elif line.lstrip().startswith('key_file='):
                  out.append(f'key_file={Path.home()}/.oci/oci_api_key.pem')
                  saw_key=True
              else:
                  out.append(line)
          if not saw_profile or not saw_key:
              raise SystemExit('OCI_CONFIG_SHAPE_INVALID')
          dst.write_text('\n'.join(out)+'\n')
          src.unlink()
          PY
          chmod 600 "$HOME/.oci/config" "$HOME/.oci/oci_api_key.pem"
      - name: Read-only OCI authentication proof
        shell: bash
        run: |
          set -euo pipefail
          oci iam region-subscription list --config-file "$HOME/.oci/config" --profile ATM_REMOTE --output json >/tmp/oci-regions.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/oci-regions.json'))
          rows=d.get('data',[])
          assert isinstance(rows,list) and rows
          print('OCI_REMOTE_AUTH=PASS subscribed_regions='+str(len(rows)))
          PY
