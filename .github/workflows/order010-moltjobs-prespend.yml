name: ORDER-010 MoltJobs Pre-Spend Gate

on:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - '.github/workflows/order010-moltjobs-prespend.yml'
      - 'scripts/order010_moltjobs_prespend.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: order010-moltjobs-prespend
  cancel-in-progress: false

jobs:
  authenticated-zero-spend-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MOLTJOBS_API_KEY: ${{ secrets.MOLTJOBS_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact-head and credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$MOLTJOBS_API_KEY"
          case "$MOLTJOBS_API_KEY" in
            mj_live_*) ;;
            *) echo 'MOLTJOBS_KEY_FORMAT=NONCANONICAL_FAIL_CLOSED' >&2; exit 1;;
          esac
          echo 'ORDER010_MOLTJOBS_EXACT_HEAD=PASS'
          echo 'MOLTJOBS_SECRET_PRESENT=YES'
          echo 'OUTGOING_SPEND_USD=0'
      - name: Authenticated read-only pre-spend probe
        id: probe
        env:
          PYTHONPATH: src:.
        run: python scripts/order010_moltjobs_prespend.py
      - name: Publish sanitized durable pre-spend receipt
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          path=Path('order010-moltjobs-prespend-receipt.json')
          if path.exists():
              receipt=json.loads(path.read_text(encoding='utf-8'))
          else:
              receipt={
                  'schema':'ATM_ORDER010_MOLTJOBS_PRESPEND_V1',
                  'auth_probe':'FAIL_CLOSED',
                  'probe_outcome':os.environ.get('PROBE_OUTCOME','unknown'),
                  'moltjobs_cert_spend_recommended':'NO',
                  'paid_certification_performed':False,
                  'bid_performed':False,
                  'outgoing_spend_usd':'0',
                  'failure_scope':'MOLTJOBS_ONLY',
                  'autonomous_lane_must_continue':True,
                  'simon_gate_parallel':True,
                  'account_gate_global_block':False,
              }
          receipt['head']=os.environ['GITHUB_SHA']
          receipt['run_id']=os.environ['GITHUB_RUN_ID']
          receipt['run_attempt']=os.environ['GITHUB_RUN_ATTEMPT']
          receipt['run_url']=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body='ORDER-010 MOLTJOBS PRE-SPEND RECEIPT\n```json\n'+json.dumps(receipt,sort_keys=True)+'\n```'
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/38/comments",
              data=json.dumps({'body':body}).encode(),
              method='POST',
              headers={
                  'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'User-Agent':'ATM-Order010-MoltJobs/1.0',
              },
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              posted=json.loads(r.read().decode())
          print('ORDER010_MOLTJOBS_RECEIPT='+str(posted.get('html_url')))
          print('MOLTJOBS_CERT_SPEND_RECOMMENDED='+str(receipt.get('moltjobs_cert_spend_recommended','NO')))
          print('OUTGOING_SPEND_USD=0')
          print('AUTONOMOUS_LANE_MUST_CONTINUE=YES')
          PY
