name: ORDER-010 WorkProtocol Relay Probe

on:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - '.github/workflows/order010-relay-probe.yml'
      - 'worker/order010-relay.js'
      - 'wrangler.order010.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact-head gate
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "ORDER010_RELAY_EXACT_HEAD=PASS"
          echo "OUTGOING_SPEND_USD=0"
      - name: Require existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy read-only relay exact head
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.order010.toml --var ATM_GIT_SHA:${{ github.sha }}
      - name: Probe WorkProtocol through Cloudflare egress
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          url='https://atm-order010-relay.simondalmasso44.workers.dev/probe'
          last=None
          for attempt in range(20):
              try:
                  req=urllib.request.Request(url+'?a='+str(attempt),headers={'Cache-Control':'no-cache','User-Agent':'ATM-Order010-Probe/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.loads(r.read().decode())
                  last=data
                  job=data.get('job') or {}
                  payments=data.get('payments') or []
                  active=[c for c in data.get('claims',[]) if str(c.get('status','')).lower() in {'claimed','accepted','working','in_progress','delivered','verifying','verified','pending_verification'}]
                  locked=any(str(p.get('escrowStatus','')).lower()=='locked' and p.get('onchainTxHash')==job.get('escrowTxHash') for p in payments)
                  assert data.get('git_sha') == os.environ['GITHUB_SHA']
                  assert data.get('ok') is True and data.get('http') == 200
                  assert job.get('id') == 'f82a9ca9-4b7f-4bdf-91c1-b5ae0516b4eb'
                  assert job.get('status') == 'open'
                  assert job.get('paymentAmount') == '75.00' and job.get('paymentCurrency') == 'USDC'
                  assert job.get('paymentRail') == 'base' and job.get('escrowFunded') is True
                  assert locked and not active
                  print(json.dumps({'ORDER010_RELAY_PROBE':'PASS','head':os.environ['GITHUB_SHA'],'job_id':job['id'],'amount_usdc':'75.00','escrow_locked':True,'active_claims':0,'outgoing_spend_usd':'0'},sort_keys=True))
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  last={'error':type(exc).__name__+':'+str(exc)[:240]}
                  time.sleep(2)
          raise SystemExit('ORDER010_RELAY_PROBE_FAILED:'+json.dumps(last,sort_keys=True))
          PY
