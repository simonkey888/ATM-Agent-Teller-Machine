name: ORDER-009-R3 Money Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - scripts/order009_r3_money_monitor.py
      - state/order009_r3_money_ledger.json
      - .github/workflows/order009-r3-money-monitor.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: order009-r3-money-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: pivot/universal-money-radar-r1
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Read authoritative TaskMarket and Base state
        run: python scripts/order009_r3_money_monitor.py
      - name: Publish only on economic state transition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          marker='ATM ORDER009 R3 MONEY STATE'
          current=json.loads(Path('order009-r3-money-state.json').read_text())
          repo=os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','User-Agent':'ATM-ORDER009-R3-money-monitor/1'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:return json.loads(r.read().decode())
          issue=get(f'https://api.github.com/repos/{repo}/issues/38')
          count=int(issue.get('comments') or 0); page=max(1,(count+99)//100)
          comments=get(f'https://api.github.com/repos/{repo}/issues/38/comments?per_page=100&page={page}')
          previous=None
          for c in reversed(comments if isinstance(comments,list) else []):
              body=str(c.get('body') or '')
              if not body.startswith(marker): continue
              import re
              m=re.search(r'```json\s*([\s\S]*?)\s*```',body)
              if m:
                  try: previous=json.loads(m.group(1))
                  except Exception: pass
              break
          keys=('state','accepted_net_usdc','settled_usdc','withdrawable_usdc','settlement_tx_hash')
          changed=previous is None or any(previous.get(k)!=current.get(k) for k in keys)
          print('MONEY_STATE_CHANGED='+str(changed).lower())
          if not changed: raise SystemExit(0)
          body=marker+'\n```json\n'+json.dumps(current,sort_keys=True)+'\n```'
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/38/comments',data=json.dumps({'body':body}).encode(),method='POST',headers={**headers,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as r: posted=json.loads(r.read().decode())
          print('MONEY_STATE_COMMENT='+str(posted.get('id') or ''))
          PY
