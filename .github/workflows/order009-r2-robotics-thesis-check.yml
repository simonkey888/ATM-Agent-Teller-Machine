name: ORDER-009-R2 Robotics Thesis Check

on:
  push:
    branches: [pivot/universal-money-radar-r1]
    paths:
      - deliverables/robotics_supply_chain_thesis/**
      - scripts/order009-r2-robotics-thesis-check.py
      - .github/workflows/order009-r2-robotics-thesis-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Exact head binding
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "TESTED_SHA_EQ_HEAD=PASS"
          echo "HEAD=${GITHUB_SHA}"
      - name: Independent artifact check
        run: |
          set -Eeuo pipefail
          python scripts/order009-r2-robotics-thesis-check.py
      - name: Artifact digest
        run: |
          set -Eeuo pipefail
          printf 'ARTIFACT_SHA256='
          sha256sum deliverables/robotics_supply_chain_thesis/ROBOTICS_SUPPLY_CHAIN_THESIS.md | awk '{print $1}'
          echo "OUTGOING_SPEND_USD=0"
          echo "EXTERNAL_MUTATION=0"
