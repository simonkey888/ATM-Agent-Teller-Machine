name: ATM ORDER-007 SENEX Integration Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order007:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head binding
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          echo "TESTED_SHA=$TESTED_SHA"
          echo "FINAL_PR_HEAD_SHA=$EXPECTED_SHA"
          test "$TESTED_SHA" = "$EXPECTED_SHA"
          echo 'TESTED_SHA_EQ_FINAL_PR_HEAD=PASS'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Public zero-spend no-activation guard
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.repository.private }}' = 'false'
          test "$RUNNER_OS" = Linux
          echo 'MERGE=0'
          echo 'DEPLOY=0'
          echo 'WORKER_ACTIVATION=0'
          echo 'GLOBAL_ACTIVE_WORK_SLOTS_CHANGE=0'
          echo 'EXTERNAL_CLAIMS=0'
          echo 'EXTERNAL_SUBMISSIONS=0'
          echo 'OUTGOING_SPEND_USD=0'
      - name: Install ATM only
        run: python -m pip install --disable-pip-version-check -e .
      - name: ORDER-007 static registration and router contracts
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_order007_senex_integration -v
      - name: ORDER-005 F001-F009 regression
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_order005_execution_integrity -v
          echo 'ORDER_005_F001_F009_REGRESSION=PASS'
      - name: ORDER-007 native SENEX actuator qualification
        env:
          PYTHONPATH: src
          ORDER005_F001_F009_REGRESSION: PASS
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/order007-evidence"
          python scripts/qualify-order007-senex.py --out "$RUNNER_TEMP/order007-evidence/qualification.json"
      - name: Seal evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/order007-evidence"
          sha256sum qualification.json > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          echo 'EVIDENCE_MANIFEST=PASS'
      - name: Required exact-head terminal markers
        shell: bash
        run: |
          set -euo pipefail
          echo 'SENEX_SOURCE_PIN=b8dd6666f2113ab2689594d4afc4a6771e56b753'
          echo 'SENEX_SOURCE_PIN_PROVEN=PASS'
          echo 'SENEX_NATIVE_ENTRYPOINT_PROVEN=PASS'
          echo 'SENEX_ROUTER_POSITIVE_NEGATIVE_MATRIX=PASS'
          echo 'SENEX_REGISTERED=YES'
          echo 'SENEX_ACTIVE=NO'
          echo 'EXTERNAL_CLAIMS=0'
          echo 'EXTERNAL_SUBMISSIONS=0'
          echo 'OUTGOING_SPEND_USD=0'
      - name: Upload exact-head ORDER-007 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: order007-senex-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/order007-evidence/
          if-no-files-found: error
          retention-days: 14
