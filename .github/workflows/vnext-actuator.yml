name: ATM VNext Actuator Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actuator:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'order-006-worker-integration-r1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head binding
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
          echo "TESTED_SHA=$TESTED_SHA"
          echo "FINAL_PR_HEAD_SHA=$EXPECTED_SHA"
          test "$TESTED_SHA" = "$EXPECTED_SHA"
          echo 'TESTED_SHA_EQ_FINAL_PR_HEAD=PASS'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Public zero-spend guard
        run: |
          set -euo pipefail
          test '${{ github.event.repository.private }}' = 'false'
          test "$RUNNER_OS" = Linux
          echo 'OUTGOING_SPEND_USD=0'
          echo 'OWNER_PC_IN_PRODUCTION_GRAPH=0'
      - name: Install ATM only
        run: python -m pip install --disable-pip-version-check -e .
      - name: Real BOQA and Zungun actuator fixture
        env:
          PYTHONPATH: src
        run: python scripts/qualify-vnext-actuator.py
      - name: ORDER-005 real production phase path
        env:
          PYTHONPATH: src
        run: python scripts/qualify-order005-production-path.py
