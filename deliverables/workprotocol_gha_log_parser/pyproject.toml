[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gha-log-parser-cli"
version = "1.0.0"
description = "Parse GitHub Actions failures into structured JSON"
requires-python = ">=3.11"

[project.scripts]
gha-log-parser = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
